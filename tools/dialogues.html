<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dialogues du mode Histoire</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Share+Tech+Mono&display=swap">
<style>
  :root{
    --void:#1a1c1d; --panel:rgba(20,22,24,.82); --line:rgba(255,255,255,.14);
    --text:#eef0ea; --muted:#9ea59f; --hazard:#f2c230; --blood:#d0352c; --life:#62c46e; --dev:#8f7bff;
    --display:'Black Ops One', Impact, 'Arial Black', sans-serif;
    --mono:'Share Tech Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--void);color:var(--text);font:15px/1.4 var(--mono)}
  header{position:sticky;top:0;z-index:1;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
  h1{margin:0;font:22px var(--display);letter-spacing:.04em;flex:1}
  h2{margin:28px 0 8px;font:20px var(--display);color:var(--hazard)}
  h3{margin:16px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
  main{max-width:1100px;margin:0 auto;padding:0 16px 48px}
  button,select,textarea{font:inherit;color:inherit}
  button{background:#2a2d2f;border:1px solid var(--line);border-radius:4px;padding:6px 10px;cursor:pointer}
  button:hover{border-color:var(--hazard)}
  #save{background:var(--hazard);color:#111;border-color:var(--hazard);font-weight:bold}
  #save:disabled{opacity:.4;cursor:default}
  #status{color:var(--muted)}
  #status.err{color:var(--blood)} #status.ok{color:var(--life)}
  .line{display:grid;grid-template-columns:130px 1fr 1fr auto;gap:8px;align-items:start;padding:6px 0;border-top:1px solid var(--line)}
  .line select{background:#111;border:1px solid var(--line);border-radius:4px;padding:6px;color:var(--hazard)}
  .line.dev select{color:var(--dev)}
  .line textarea{width:100%;min-height:38px;resize:vertical;background:#111;border:1px solid var(--line);border-radius:4px;padding:6px}
  .line textarea:focus{outline:none;border-color:var(--hazard)}
  .tools{display:flex;gap:4px}
  .del:hover{border-color:var(--blood);color:var(--blood)}
  .cols{display:grid;grid-template-columns:130px 1fr 1fr auto;gap:8px;font-size:12px;color:var(--muted)}
  .add{margin-top:6px}
  @media (max-width:700px){
    .line,.cols{grid-template-columns:1fr}
    .cols{display:none}
  }
</style>
</head>
<body>
<header>
  <h1>Dialogues · mode Histoire</h1>
  <span id="status"></span>
  <button id="save" disabled>Enregistrer</button>
</header>
<main id="scenes"></main>
<script type="module" src="./dialogues.js"></script>
</body>
</html>
