<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tête Carrée</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Share+Tech+Mono&display=swap">
<link rel="stylesheet" href="./src/style.css">

<canvas id="cv"></canvas>

<div id="hud" hidden>
  <div class="top">
    <div class="panel vitals">
      <div class="hpRow">
        <canvas id="face" width="13" height="13" aria-hidden="true"></canvas>
        <div class="hpCol">
          <div class="hpHead"><span class="label" data-i18n="health"></span><span id="hpNum">100</span></div>
          <div class="bar hp" id="hpBar"><i id="hpGhost"></i><i id="hpFill"></i><b id="hpTicks"></b></div>
        </div>
      </div>
      <div id="score">0</div>
      <div class="money"><i class="coinico" aria-hidden="true"></i><span id="money">0</span> <span data-i18n="coins"></span></div>
      <div id="pot" hidden></div>
      <div id="next"></div>
    </div>
    <div class="panel wave">
      <div class="label" data-i18n="wave"></div>
      <div id="waveNum">1</div>
      <div id="left">—</div>
    </div>
    <div class="right">
      <div class="panel combo">
        <div class="label" data-i18n="combo"></div>
        <div id="comboNum">×1</div>
        <div id="comboKills">0 kill</div>
        <div class="bar"><i id="comboFill" style="width:0"></i></div>
      </div>
      <button id="pauseBtn" data-i18n-aria="pause"><span></span></button>
    </div>
  </div>
  <div id="weapons"></div>
  <div id="fps" data-i18n-aria="fpsAria"><canvas id="fpsCv" width="192" height="52"></canvas><span id="fpsTxt">— fps</span></div>
  <div id="mods" data-i18n-aria="activeCards"></div>
</div>

<div id="touch">
  <div id="stickZone"></div>
  <div id="aimZone"></div>
  <div class="stickBase" id="stickBase"><div class="stickKnob" id="stickKnob"></div></div>
  <div class="stickBase aim" id="aimBase"><div class="stickKnob" id="aimKnob"></div></div>
  <button id="rollBtn" data-i18n="rollBtn" data-i18n-aria="rollAria"></button>
  <button id="swapBtn" data-i18n="swapBtn" data-i18n-aria="swapAria"></button>
</div>

<div id="banner"><div class="m"></div><div class="s"></div></div>
<div id="toast" role="status"></div>

<div class="overlay" id="titleScreen">
  <div class="tside" id="titleMain">
    <div class="tbrand">
      <canvas id="mascot" width="13" height="13" aria-hidden="true"></canvas>
      <h1 class="logo">Tête <em>Carrée</em></h1>
      <div class="stripe"></div>
    </div>
    <nav class="tmenu" id="titleMenu" data-i18n-aria="infoAria">
      <button class="btn" id="playBtn" data-i18n="play"></button>
      <button class="titem" id="arenaBtn"></button>
      <button class="titem" data-panel="panelCtrl" data-i18n="controls"></button>
      <button class="titem" data-panel="panelBeasts" data-i18n="bestiary"></button>
      <button class="titem" data-panel="panelArsenal" data-i18n="arsenal"></button>
      <button class="titem" data-panel="panelCards" data-i18n="cardsTitle"></button>
      <button class="titem" data-panel="panelOpts" data-i18n="options"></button>
      <canvas id="arenaMap" aria-hidden="true"></canvas>
    </nav>
    <div class="tfoot">
      <p class="starthint only-desk" data-i18n-html="startDesk"></p>
      <p class="starthint only-pad" data-i18n="startPad"></p>
      <p class="padhint nopad" id="padHint" data-i18n="padHint"></p>
      <span class="tflags">
        <button class="tflag" data-lang="fr" aria-label="Français" lang="fr"><svg viewBox="0 0 3 2" aria-hidden="true"><path fill="#002395" d="M0 0h1v2H0z"/><path fill="#fff" d="M1 0h1v2H1z"/><path fill="#ed2939" d="M2 0h1v2H2z"/></svg></button>
        <button class="tflag" data-lang="en" aria-label="English" lang="en"><svg viewBox="0 0 60 30" aria-hidden="true"><clipPath id="ukClip"><path d="M30 15h30v15zv15H0zH0V0zV0h30z"/></clipPath><path fill="#012169" d="M0 0h60v30H0z"/><path stroke="#fff" stroke-width="6" d="M0 0l60 30m0-30L0 30"/><path stroke="#c8102e" stroke-width="4" clip-path="url(#ukClip)" d="M0 0l60 30m0-30L0 30"/><path stroke="#fff" stroke-width="10" d="M30 0v30M0 15h60"/><path stroke="#c8102e" stroke-width="6" d="M30 0v30M0 15h60"/></svg></button>
      </span>
    </div>
  </div>
  <section class="rpanel records" id="records">
    <h2 class="rlabel" data-i18n="lastRun"></h2><div id="lastRun"></div>
    <h2 class="rlabel" data-i18n="bestRuns"></h2><div id="runsTitle"></div>
  </section>
  <div class="card tpanel" id="panelCtrl" hidden>
    <h2 data-i18n="controls"></h2>
    <dl class="keys only-desk">
      <dt data-i18n="kMove"></dt><dd data-i18n="deskMove"></dd>
      <dt data-i18n="kShoot"></dt><dd data-i18n="deskShoot"></dd>
      <dt data-i18n="kRoll"></dt><dd data-i18n="deskRoll"></dd>
      <dt data-i18n="kWeapons"></dt><dd data-i18n="deskWeapons"></dd>
      <dt data-i18n="pause"></dt><dd data-i18n="deskPause"></dd>
      <dt data-i18n="kFps"></dt><dd data-i18n="deskFps"></dd>
      <dt data-i18n="kWave"></dt><dd data-i18n="deskWave"></dd>
      <dt data-i18n="kShop"></dt><dd data-i18n="deskShop"></dd>
    </dl>
    <dl class="keys only-pad">
      <dt data-i18n="kMove"></dt><dd data-i18n="padMove"></dd>
      <dt data-i18n="kShoot"></dt><dd data-i18n="padShoot"></dd>
      <dt data-i18n="kRoll"></dt><dd data-i18n="padRoll"></dd>
      <dt data-i18n="kWeapons"></dt><dd data-i18n="padWeapons"></dd>
      <dt data-i18n="kWave"></dt><dd data-i18n="padWave"></dd>
      <dt data-i18n="kShop"></dt><dd data-i18n="padShop"></dd>
      <dt data-i18n="pause"></dt><dd data-i18n="padPause"></dd>
    </dl>
    <dl class="keys only-touch">
      <dt data-i18n="kMove"></dt><dd data-i18n="touchMove"></dd>
      <dt data-i18n="kShoot"></dt><dd data-i18n="touchShoot"></dd>
      <dt data-i18n="kRoll"></dt><dd data-i18n="touchRoll"></dd>
      <dt data-i18n="kWeapons"></dt><dd data-i18n="touchWeapons"></dd>
      <dt data-i18n="kShop"></dt><dd data-i18n="touchShop"></dd>
    </dl>
    <button class="btn ghost tclose" data-i18n="close"></button>
  </div>
  <div class="card tpanel" id="panelBeasts" hidden>
    <h2 data-i18n="bestiary"></h2>
    <p data-i18n="bestiaryText"></p>
    <ul class="beasts" id="beastList"></ul>
    <button class="btn ghost tclose" data-i18n="close"></button>
  </div>
  <div class="card tpanel" id="panelArsenal" hidden>
    <h2 data-i18n="arsenal"></h2>
    <p data-i18n="arsenalText"></p>
    <ul class="arms" id="arsenalList"></ul>
    <button class="btn ghost tclose" data-i18n="close"></button>
  </div>
  <div class="card tpanel" id="panelCards" hidden>
    <h2 data-i18n="cardsTitle"></h2>
    <p data-i18n="cardsText"></p>
    <div id="cardsList"></div>
    <button class="btn ghost tclose" data-i18n="close"></button>
  </div>
  <div class="card tpanel" id="panelOpts" hidden>
    <h2 data-i18n="options"></h2>
    <div class="btns opts">
      <button class="btn ghost optMute"></button>
      <button class="btn ghost optFps"></button>
      <button class="btn ghost optOl"></button>
      <button class="btn ghost optLang" data-i18n="optLang"></button>
    </div>
    <button class="btn ghost tclose" data-i18n="close"></button>
  </div>
</div>

<div class="overlay pick" id="pickScreen" hidden>
  <div class="pickwrap">
    <div class="pickhead">
      <div class="picktitle"><span id="pickWave"></span><h2 id="pickTitle"></h2></div>
      <div class="purse" id="purse"><i class="coinico" aria-hidden="true"></i><span class="label" data-i18n="coins"></span><b id="purseNum">0</b></div>
    </div>
    <div class="cards" id="cards"></div>
    <div class="shop" id="shop">
      <button class="sbtn" id="rerollBtn"><kbd class="only-desk">R</kbd><span data-i18n="reroll"></span><span class="price" id="rerollPrice"></span></button>
      <button class="sbtn" id="extraBtn"><kbd class="only-desk">C</kbd><span data-i18n="extraCard"></span><span class="price" id="extraPrice"></span></button>
      <button class="sbtn" id="banBtn"><kbd class="only-desk">B</kbd><span id="banLabel"></span><span class="price" id="banPrice"></span></button>
    </div>
    <div class="buyback" id="buyback"></div>
    <p class="pickhint only-desk" id="pickHint"></p>
    <p class="pickhint only-pad" data-i18n="pickHintPad"></p>
  </div>
</div>

<div class="overlay" id="pauseScreen" hidden>
  <div class="card">
    <h2 data-i18n="pause"></h2>
    <div class="label" data-i18n="activeCards"></div>
    <div id="pauseMods" class="pmods"></div>
    <p id="pauseScore" class="pickhint"></p>
    <div class="btns">
      <button class="btn" id="resumeBtn" data-i18n="resume"></button>
      <button class="btn ghost optMute"></button>
      <button class="btn ghost optFps"></button>
      <button class="btn ghost optOl"></button>
      <button class="btn ghost" id="restartBtn" data-i18n="restart"></button>
    </div>
  </div>
</div>

<div class="overlay" id="overScreen" hidden>
  <div class="card">
    <h2 data-i18n="overTitle"></h2>
    <p id="overLine"></p>
    <div class="stats">
      <div><b id="ovScore">0</b><span data-i18n="score"></span></div>
      <div><b id="ovWave">0</b><span data-i18n="wave"></span></div>
      <div><b id="ovCombo">0</b><span data-i18n="bestCombo"></span></div>
    </div>
    <h3 class="rlabel" data-i18n="bestRuns"></h3>
    <div id="runsOver"></div>
    <div class="btns"><button class="btn" id="againBtn" data-i18n="again"></button></div>
  </div>
</div>

<script type="module" src="./src/main.js"></script>

</body></html>
